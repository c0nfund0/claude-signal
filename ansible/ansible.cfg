[defaults]
inventory = inventory/hosts.yml
retry_files_enabled = False
interpreter_python = auto_silent
# The proxy's public IP changes on every stop/start (no Elastic IP - see main
# README), which would otherwise mean stale known_hosts entries on every
# redeploy. Disabled deliberately, not out of laziness.
host_key_checking = False

[ssh_connection]
pipelining = True
