all:
  vars:
    ansible_user: ubuntu
  children:
    proxy:
      hosts:
        proxy_host:
          ansible_host: "{{ proxy_public_ip }}"
    ai:
      hosts:
        ai_host:
          # No public IP, no route to the internet - reached only by jumping
          # through the proxy instance, same as the manual `ssh -J` workflow
          # documented in the main README.
          ansible_host: "{{ ai_private_ip }}"
          ansible_ssh_common_args: "-o ProxyJump=ubuntu@{{ proxy_public_ip }}"
    deploy:
      hosts:
        deploy_host:
          # Same isolation model as ai_host - no public IP, reached only via the
          # proxy jump host.
          ansible_host: "{{ deploy_private_ip }}"
          ansible_ssh_common_args: "-o ProxyJump=ubuntu@{{ proxy_public_ip }}"
