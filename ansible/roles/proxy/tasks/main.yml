---
- name: Install proxy packages
  ansible.builtin.apt:
    name:
      - squid
      - openjdk-25-jre-headless   # signal-cli 0.14.x needs Java 25 specifically
      - curl
      - python3
      - podman   # builds the ai instance's sandbox container image - real internet
                 # access here avoids needing Docker Hub's several pull-path domains
                 # allowed through Squid; the built image is relayed to ai instead
      - nginx    # reverse-proxies public port 80 to the deploy instance, gated open/
                 # closed by claude-signal-web-gate.sh - see network.tf for why the
                 # security group leaves the port always reachable
      - ffmpeg       # faster-whisper's audio decoder falls back to this for voice-note
                     # codecs PyAV can't handle
      - python3-venv # isolates the voice-message pipeline's real dependencies
                     # (faster-whisper, edge-tts) from every other proxy daemon, which
                     # stay pure-stdlib - see signal_bridge.py's module docstring
      - certbot      # Let's Encrypt cert for app_domain, HTTP-01 via webroot - see
                     # the certbot tasks below. Harmless to install even when
                     # app_domain isn't set (nothing invokes it in that case).
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure automatic security updates
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/auto_updates.yml"

- name: Check for existing signal-cli install
  ansible.builtin.stat:
    path: /opt/signal-cli/bin/signal-cli
  register: signal_cli_bin

- name: Ensure /opt/signal-cli exists
  ansible.builtin.file:
    path: /opt/signal-cli
    state: directory
    mode: "0755"
  when: not signal_cli_bin.stat.exists

- name: Look up latest signal-cli release metadata
  ansible.builtin.uri:
    url: https://api.github.com/repos/AsamK/signal-cli/releases/latest
    return_content: true
  register: signal_cli_release
  when: not signal_cli_bin.stat.exists

- name: Determine signal-cli download URL
  # The release has several .tar.gz assets (json-schemas, Linux-native, Linux-client,
  # the plain JRE-based one). We want the plain signal-cli-X.Y.Z.tar.gz - no extra
  # hyphenated suffix before the version's trailing .tar.gz.
  ansible.builtin.set_fact:
    signal_cli_download_url: >-
      {{ signal_cli_release.json.assets
         | selectattr('browser_download_url', 'match', '^.*/signal-cli-[0-9.]+\.tar\.gz$')
         | map(attribute='browser_download_url') | first }}
  when: not signal_cli_bin.stat.exists

- name: Download signal-cli
  ansible.builtin.get_url:
    url: "{{ signal_cli_download_url }}"
    dest: /tmp/signal-cli.tar.gz
    mode: "0644"
  when: not signal_cli_bin.stat.exists

- name: Extract signal-cli
  ansible.builtin.unarchive:
    src: /tmp/signal-cli.tar.gz
    dest: /opt/signal-cli
    remote_src: true
    extra_opts:
      - --strip-components=1
  when: not signal_cli_bin.stat.exists

- name: Remove downloaded signal-cli tarball
  ansible.builtin.file:
    path: /tmp/signal-cli.tar.gz
    state: absent
  when: not signal_cli_bin.stat.exists

- name: Deploy signal_bridge.py
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../server/proxy/signal_bridge.py"
    dest: /opt/claude-signal/signal_bridge.py
    owner: claude-signal
    group: claude-signal
    mode: "0750"
  notify: restart signal-bridge

- name: Deploy voice_pipeline.py (STT/TTS helper for voice messages, run as a subprocess)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../server/proxy/voice_pipeline.py"
    dest: /opt/claude-signal/voice_pipeline.py
    owner: claude-signal
    group: claude-signal
    mode: "0750"

- name: Create the voice pipeline virtualenv
  become_user: claude-signal
  ansible.builtin.command: python3 -m venv /opt/claude-signal/voice-venv
  args:
    creates: /opt/claude-signal/voice-venv/bin/python3

- name: Install voice pipeline Python dependencies (faster-whisper, edge-tts)
  become_user: claude-signal
  ansible.builtin.pip:
    name:
      - faster-whisper
      - edge-tts
    virtualenv: /opt/claude-signal/voice-venv

- name: Pre-fetch the whisper model (real internet access here, ahead of the first live voice message)
  become_user: claude-signal
  ansible.builtin.command: >
    /opt/claude-signal/voice-venv/bin/python3 -c
    "from faster_whisper import WhisperModel; WhisperModel('{{ voice_stt_model | default('base') }}')"
  changed_when: false

- name: Deploy approval_daemon.py
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../server/proxy/approval_daemon.py"
    dest: /opt/claude-signal/approval_daemon.py
    owner: claude-signal
    group: claude-signal
    mode: "0750"
  notify: restart approval-daemon

- name: Deploy idle_monitor.py
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../server/proxy/idle_monitor.py"
    dest: /opt/claude-signal/idle_monitor.py
    owner: claude-signal
    group: claude-signal
    mode: "0750"
  notify: restart idle-monitor

# nginx's access logs are www-data:adm 0640 (Ubuntu's default logrotate config
# for /var/log/nginx/*.log - confirmed live), so idle_monitor needs adm-group
# membership to read claude-signal-web.log for its web-session idle check.
- name: Add claude-signal to the adm group (read access to nginx logs for idle_monitor)
  ansible.builtin.user:
    name: claude-signal
    groups: adm
    append: true
  notify: restart idle-monitor

# GITHUB_TOKEN is deliberately NOT kept in group_vars/all.yml - the user sets it by
# SSHing into the box directly (never pasted into chat/session, same rule as every
# other credential here). If group_vars doesn't define github_token, preserve
# whatever is already in the live env file instead of templating an empty value
# over it. no_log on both tasks so the token never appears in Ansible output/logs.
- name: Check for an existing GITHUB_TOKEN already set on the server
  ansible.builtin.command: grep -h '^GITHUB_TOKEN=' /etc/claude-signal/env
  register: existing_github_token
  changed_when: false
  failed_when: false
  no_log: true

- name: Preserve an existing on-server GITHUB_TOKEN if group_vars doesn't define one
  ansible.builtin.set_fact:
    effective_github_token: >-
      {{ github_token if (github_token | default('') | length > 0)
         else (existing_github_token.stdout.split('=', 1)[1] if existing_github_token.rc == 0 else '') }}
  no_log: true

- name: Template proxy env file
  ansible.builtin.template:
    src: env.j2
    dest: /etc/claude-signal/env
    owner: root
    group: claude-signal
    mode: "0640"
  notify:
    - restart signal-bridge
    - restart approval-daemon
    - restart idle-monitor
  no_log: true  # RELAY_SECRET, STOP_SECRET, GITHUB_TOKEN all render into this file

- name: Seed allowlist state (only if missing - live runtime state, never overwritten)
  ansible.builtin.copy:
    content: "{}"
    dest: /etc/claude-signal/allowlist.json
    owner: claude-signal
    group: claude-signal
    mode: "0640"
    force: false

- name: Seed Squid allowlist file (only if missing - live runtime state, never overwritten)
  ansible.builtin.copy:
    content: ""
    dest: /etc/squid/allowed_domains.txt
    owner: claude-signal
    group: claude-signal
    mode: "0644"
    force: false

- name: Add /etc/hosts entry for the CS2 server (optional integration - see README)
  # Squid's dstdomain ACL treats this exactly like any other domain (allow/block-able,
  # timed or permanent) once it's resolvable - no Squid config changes needed beyond
  # this host mapping. cs2_private_ip is the CS2 instance's private IP, same VPC, so
  # this never touches the public internet or needs an Elastic IP on either side.
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ cs2_private_ip }} {{ cs2_ssh_hostname | default('cs2-server.internal') }}"
    regexp: "^[0-9.]+\\s+{{ cs2_ssh_hostname | default('cs2-server.internal') }}$"
    state: present
  when: cs2_private_ip is defined and cs2_private_ip | length > 0

- name: Render squid.conf
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/squid -k parse -f %s
  notify: restart squid

- name: Template the web-gate toggle script
  ansible.builtin.template:
    src: claude-signal-web-gate.sh.j2
    dest: /usr/local/sbin/claude-signal-web-gate
    owner: root
    group: root
    mode: "0755"

- name: Install sudoers rule for squid reconfigure + web gate toggling (claude-signal may run nothing else)
  ansible.builtin.copy:
    src: claude-signal.sudoers
    dest: /etc/sudoers.d/claude-signal
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Seed the web gate state as closed (only if missing - live runtime state, never overwritten)
  ansible.builtin.copy:
    content: |
      set $gate_closed 1;
    dest: /etc/claude-signal/web_gate_state.conf
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Seed an empty apps.conf (only if missing - approval_daemon.py owns regenerating this from here on)
  ansible.builtin.copy:
    content: "# Managed by approval_daemon.py - see its _sync_apps. Empty until the first deploy.\n"
    dest: /etc/claude-signal/apps.conf
    owner: claude-signal
    group: claude-signal
    mode: "0644"
    force: false

- name: Template the nginx websocket upgrade map (http-level, needed by the web-gate site)
  ansible.builtin.template:
    src: claude-signal-websocket-map.nginx.j2
    dest: /etc/nginx/conf.d/claude-signal-websocket-map.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Template the nginx no-PII log format (http-level, needed by the web-gate site)
  ansible.builtin.template:
    src: claude-signal-nolog-format.nginx.j2
    dest: /etc/nginx/conf.d/claude-signal-nolog-format.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Create the landing page directory (claude-signal-owned - approval_daemon.py rewrites the file directly, no sudo needed)
  ansible.builtin.file:
    path: /var/www/claude-signal-landing
    state: directory
    owner: claude-signal
    group: claude-signal
    mode: "0755"

- name: Seed the landing page (only if missing - approval_daemon.py owns regenerating this from here on)
  ansible.builtin.template:
    src: claude-signal-landing.html.j2
    dest: /var/www/claude-signal-landing/index.html
    owner: claude-signal
    group: claude-signal
    mode: "0644"
    force: false

- name: Template the nginx web-gate site
  ansible.builtin.template:
    src: claude-signal-web.nginx.j2
    dest: /etc/nginx/sites-available/claude-signal-web.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Disable the default nginx site (would otherwise also claim port 80)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Enable the claude-signal-web nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/claude-signal-web.conf
    dest: /etc/nginx/sites-enabled/claude-signal-web.conf
    state: link
  notify: reload nginx

# --- Optional: HTTPS for app_domain (see README's "Custom domain" section) ---
# Everything below is skipped entirely when app_domain is unset - the "when"s on
# each task are what makes this optional, not a top-level include.

- name: Ensure nginx is actually running before attempting certbot validation
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
  when: app_domain is defined and app_domain | length > 0

- name: Apply any pending nginx reload now, so certbot sees the acme-challenge location live
  ansible.builtin.meta: flush_handlers

- name: Create the certbot webroot directory
  ansible.builtin.file:
    path: /var/www/certbot
    state: directory
    mode: "0755"
  when: app_domain is defined and app_domain | length > 0

- name: Check for an existing Let's Encrypt cert for app_domain
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ app_domain | default('') }}/fullchain.pem"
  register: app_cert_before
  when: app_domain is defined and app_domain | length > 0

- name: Obtain a Let's Encrypt certificate for app_domain
  # -m/--register-unsafely-without-email are mutually exclusive - the latter is
  # certbot's normal (if dramatically-named) supported way to skip account email
  # entirely. Without an email you just don't get a heads-up if renewal is silently
  # failing - see the README note on why that's worth having here specifically.
  ansible.builtin.command: >
    certbot certonly --webroot -w /var/www/certbot -d {{ app_domain }}
    --non-interactive --agree-tos
    {{ ('-m ' + letsencrypt_email) if (letsencrypt_email | default('') | length > 0)
       else '--register-unsafely-without-email' }}
    --deploy-hook "systemctl reload nginx"
  when: >
    app_domain is defined and app_domain | length > 0
    and not app_cert_before.stat.exists
  register: certbot_obtain
  changed_when: "'Successfully received certificate' in certbot_obtain.stdout"

- name: Check whether the Let's Encrypt cert for app_domain exists now
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ app_domain | default('') }}/fullchain.pem"
  register: app_cert
  when: app_domain is defined and app_domain | length > 0

- name: Template the nginx HTTPS site for app_domain
  ansible.builtin.template:
    src: claude-signal-web-ssl.nginx.j2
    dest: /etc/nginx/sites-available/claude-signal-web-ssl.conf
    owner: root
    group: root
    mode: "0644"
  when: app_domain is defined and app_domain | length > 0 and app_cert.stat.exists
  notify: reload nginx

- name: Enable the claude-signal-web-ssl nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/claude-signal-web-ssl.conf
    dest: /etc/nginx/sites-enabled/claude-signal-web-ssl.conf
    state: link
  when: app_domain is defined and app_domain | length > 0 and app_cert.stat.exists
  notify: reload nginx

- name: Deploy the boot-time certbot renewal unit
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../server/proxy/systemd/claude-signal-certbot-renew.service"
    dest: /etc/systemd/system/claude-signal-certbot-renew.service
    owner: root
    group: root
    mode: "0644"
  when: app_domain is defined and app_domain | length > 0
  notify: daemon-reload

- name: Enable the boot-time certbot renewal unit
  ansible.builtin.systemd:
    name: claude-signal-certbot-renew
    enabled: true
    daemon_reload: true
  when: app_domain is defined and app_domain | length > 0

# --- LLM edge (WireGuard + nginx front for the home LLM box - see
# github.com/c0nfund0/LocalModel's docs/AWS-HANDOFF.md). The proxy plays the
# "edge" role from that doc instead of a separate dedicated instance, reusing
# its existing Elastic IP - see network.tf's proxy_wireguard_public rule and
# group_vars/all.yml's llm_edge_* vars. Unlike app_domain above this isn't
# optional/conditional - it's a real always-on feature once configured - but
# it's still self-contained here so it's obvious what to remove if it's ever
# torn down.

- name: Install WireGuard
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
    state: present

# nginx's tunnel-only API-key listener (see claude-signal-llm-edge.nginx.j2)
# binds directly to the wg0 interface's own address (10.8.0.1) - without this,
# nginx would fail to start on a reboot where systemd happens to start it
# before wg-quick@wg0 brings that address up (no explicit ordering between the
# two units). This is the standard fix for binding to an interface address
# that might not exist yet at bind time - a common pattern for services
# fronting VPN/floating IPs.
- name: Allow nginx to bind to addresses that may not exist yet (wg0, brought up separately)
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    state: present
    sysctl_set: true

- name: Check whether the LLM edge WireGuard keypair already exists
  ansible.builtin.stat:
    path: /etc/claude-signal/llm-edge-wg.key
  register: llm_edge_wg_key_stat

- name: Generate the LLM edge WireGuard private key (once - never rotated by ansible)
  ansible.builtin.shell: umask 077 && wg genkey > /etc/claude-signal/llm-edge-wg.key
  when: not llm_edge_wg_key_stat.stat.exists

- name: Derive the LLM edge WireGuard public key
  ansible.builtin.shell: wg pubkey < /etc/claude-signal/llm-edge-wg.key > /etc/claude-signal/llm-edge-wg.pub
  when: not llm_edge_wg_key_stat.stat.exists

# /etc/claude-signal itself is 0750 claude-signal:claude-signal (it holds real
# secrets elsewhere) - nginx (www-data) can't traverse into it at all, 403ing
# on the public key too even though the file itself is world-readable. Rather
# than loosen that directory (or add www-data to the claude-signal group,
# which would ALSO hand it read access to /etc/claude-signal/env's real
# secrets), just publish a copy of this one non-sensitive file somewhere
# nginx can already reach.
- name: Create a public-readable directory for the LLM edge's own WireGuard public key
  ansible.builtin.file:
    path: /var/www/llm-edge-public
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Publish the LLM edge WireGuard public key where nginx can actually serve it
  ansible.builtin.copy:
    src: /etc/claude-signal/llm-edge-wg.pub
    dest: /var/www/llm-edge-public/edge-pubkey
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Read the LLM edge WireGuard private key back in for templating wg0.conf
  ansible.builtin.slurp:
    src: /etc/claude-signal/llm-edge-wg.key
  register: llm_edge_wg_key_slurp
  no_log: true

- name: Set a fact with the decoded LLM edge WireGuard private key
  ansible.builtin.set_fact:
    llm_edge_wg_private_key: "{{ llm_edge_wg_key_slurp.content | b64decode | trim }}"
  no_log: true

- name: Seed the WireGuard interface config (only if missing - a [Peer] block gets
    appended at runtime by claude-signal-llm-edge-add-peer, which this must never overwrite)
  ansible.builtin.template:
    src: claude-signal-llm-edge-wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
    force: false
  no_log: true

- name: Enable and start the LLM edge WireGuard interface
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started

- name: Install the LLM edge helper scripts (edge-info, edge-add-peer)
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/usr/local/sbin/{{ item.dest }}"
    owner: root
    group: root
    mode: "0700"
  loop:
    - { src: claude-signal-llm-edge-info.sh.j2, dest: claude-signal-llm-edge-info }
    - { src: claude-signal-llm-edge-add-peer.sh.j2, dest: claude-signal-llm-edge-add-peer }

- name: Check for an existing Let's Encrypt cert for llm_edge_domain
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ llm_edge_domain | default('') }}/fullchain.pem"
  register: llm_edge_cert_before
  when: llm_edge_domain is defined and llm_edge_domain | length > 0

- name: Obtain a Let's Encrypt certificate for llm_edge_domain
  ansible.builtin.command: >
    certbot certonly --webroot -w /var/www/certbot -d {{ llm_edge_domain }}
    --non-interactive --agree-tos
    {{ ('-m ' + letsencrypt_email) if (letsencrypt_email | default('') | length > 0)
       else '--register-unsafely-without-email' }}
    --deploy-hook "systemctl reload nginx"
  when: >
    llm_edge_domain is defined and llm_edge_domain | length > 0
    and not llm_edge_cert_before.stat.exists
  register: llm_edge_certbot_obtain
  changed_when: "'Successfully received certificate' in llm_edge_certbot_obtain.stdout"

- name: Check whether the Let's Encrypt cert for llm_edge_domain exists now
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ llm_edge_domain | default('') }}/fullchain.pem"
  register: llm_edge_cert
  when: llm_edge_domain is defined and llm_edge_domain | length > 0

- name: Template the nginx site for llm_edge_domain
  ansible.builtin.template:
    src: claude-signal-llm-edge.nginx.j2
    dest: /etc/nginx/sites-available/claude-signal-llm-edge.conf
    owner: root
    group: root
    mode: "0644"
  when: llm_edge_domain is defined and llm_edge_domain | length > 0 and llm_edge_cert.stat.exists
  notify: reload nginx

- name: Enable the claude-signal-llm-edge nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/claude-signal-llm-edge.conf
    dest: /etc/nginx/sites-enabled/claude-signal-llm-edge.conf
    state: link
  when: llm_edge_domain is defined and llm_edge_domain | length > 0 and llm_edge_cert.stat.exists
  notify: reload nginx

- name: Install proxy systemd units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../server/proxy/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - claude-signal-signal-cli-daemon.service
    - claude-signal-signal-bridge.service
    - claude-signal-approval-daemon.service
    - claude-signal-idle-monitor.service
  notify: daemon-reload

- name: Enable and start Squid and the proxy daemons
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - squid
    - nginx
    - claude-signal-approval-daemon
    - claude-signal-signal-cli-daemon
    - claude-signal-signal-bridge
    - claude-signal-idle-monitor
